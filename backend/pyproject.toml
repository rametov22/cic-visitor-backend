[project]
name = "cic-visitor"
version = "0.1.0"
description = "CIC Visitor backend"
requires-python = ">=3.13,<4"
dependencies = [
    "celery>=5.5.3,<6.0.0",
    "django>=5.2.4,<6.0.0",
    "django-cleanup>=9.0.0,<10.0.0",
    "django-cors-headers>=4.7.0,<5.0.0",
    "django-filter>=25.1,<26.0",
    "django-modeltranslation>=0.19.17,<0.21.0",
    "django-rosetta>=0.10.2,<0.11.0",
    "django-structlog>=8.1.0,<10.0.0",
    "djangorestframework>=3.16.0,<4.0.0",
    "drf-spectacular>=0.28.0,<0.30.0",
    "gunicorn>=23.0.0,<24.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pillow>=11.3.0,<13.0.0",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "python-decouple>=3.8,<4.0",
    "redis>=6.4.0,<8.0.0",
    "setproctitle>=1.3.6,<2.0.0",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.0.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.408",
    "pytest>=8.4.1",
    "pytest-django>=4.9.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--no-migrations"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "DJ", "RUF"]
ignore = [
    "DJ001",
    "DJ007",
    "DJ012",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403", "F405"]
"**/config/settings/*" = ["F401", "F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["common", "config", "iccu"]
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
django = ["django"]
