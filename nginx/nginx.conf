user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $request_id_value {
        default $http_x_request_id;
        "" "$msec-$pid-$connection-$request_length";
    }

    log_format json_main escape=json
        '{"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$request_id_value",'
        '"method":"$request_method",'
        '"status":$status,'
        '"host":"$host",'
        '"uri":"$uri",'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log /dev/stdout json_main;
    error_log /dev/stderr warn;
    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    upstream django {
        zone django_zone 64k;
        server backend:8000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        location ~ /\. {
            deny all;
        }

        location /static/ {
            alias /var/www/static/;
            expires 7d;
        }

        location /media/ {
            alias /var/www/media/;
            expires 1d;
        }

        location / {
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id_value;
            # The external edge proxy owns X-Forwarded-Proto. Do not overwrite it.

            proxy_connect_timeout 2s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_pass http://django;
        }
    }
}
